name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Unzip project
        run:  unzip -o *.zip
      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: amar-khata-apk
      - uses: actions/upload-artifact@v4
        with:
          name: amar-khata-apk
          path: amar-khata-apk/app/build/outputs/apk/debug/app-debug.apk
